name: Sync NyanTV Repository

permissions:
  contents: write
  issues: write

concurrency:
  group: nyantv-sync
  cancel-in-progress: true

on:
  schedule:
    - cron: "0 * * * *" # Run every hour
  workflow_dispatch:

jobs:
  sync-code:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout NyanTV/NyanTV
        uses: actions/checkout@v4
        with:
          repository: NyanTV/NyanTV
          fetch-depth: 0
          persist-credentials: false

      - name: Configure Git identity
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Sync to GitHub (itsmechinmoy/NyanTV)
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          DEFAULT_BRANCH=$(git remote show origin | grep 'HEAD branch' | awk '{print $NF}')
          if [ -z "$DEFAULT_BRANCH" ]; then
            echo "Error: Could not determine default branch. Repository might be empty."
            exit 1
          fi
          echo "Default branch is $DEFAULT_BRANCH"
          git remote add github "https://${PAT_TOKEN}@github.com/itsmechinmoy/NyanTV.git"
          git push github "$DEFAULT_BRANCH:main" --force
          git push github --tags --force

      # - name: Set up SSH for Codeberg and GitLab
      #   run: |
      #     mkdir -p ~/.ssh
      #     echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
      #     chmod 600 ~/.ssh/id_ed25519
      #     ssh-keyscan -t rsa codeberg.org >> ~/.ssh/known_hosts
      #     ssh-keyscan -t rsa gitlab.com >> ~/.ssh/known_hosts
      #
      # - name: Sync to Codeberg
      #   run: |
      #     DEFAULT_BRANCH=$(git remote show origin | grep 'HEAD branch' | awk '{print $NF}')
      #     git remote add codeberg git@codeberg.org:itsmechinmoy/nyantv.git
      #     git push codeberg "$DEFAULT_BRANCH:main" --force
      #   env:
      #     GIT_SSH_COMMAND: ssh -i ~/.ssh/id_ed25519
      #
      # - name: Sync to GitLab
      #   run: |
      #     DEFAULT_BRANCH=$(git remote show origin | grep 'HEAD branch' | awk '{print $NF}')
      #     git remote add gitlab git@gitlab.com:itsmechinmoy/nyantv.git
      #     git push gitlab "$DEFAULT_BRANCH:main" --force
      #   env:
      #     GIT_SSH_COMMAND: ssh -i ~/.ssh/id_ed25519

  sync-issues-and-prs:
    runs-on: ubuntu-latest
    needs: sync-code
    steps:
      - name: Copy issues and PRs from NyanTV/NyanTV as GitHub issues
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          SOURCE_REPO: NyanTV/NyanTV
          TARGET_REPO: itsmechinmoy/NyanTV
        run: |
          set -e

          gh label create "pull-request" --repo "$TARGET_REPO" --color "1d76db" --description "Mirrored pull request" --force

          sync_item() {
            local NUMBER=$1
            local KIND=$2 # "issue" or "pr"
            local MARKER="Synced from ${SOURCE_REPO}#${NUMBER}"

            local CANDIDATES EXISTING CAND CAND_BODY
            CANDIDATES=$(gh api -X GET search/issues -f q="repo:${TARGET_REPO} in:body \"${MARKER}\"" --jq '.items[].number // empty')
            sleep 1
            EXISTING=""
            for CAND in $CANDIDATES; do
              CAND_BODY=$(gh api "repos/${TARGET_REPO}/issues/${CAND}" --jq '.body // ""')
              if echo "$CAND_BODY" | grep -qF "$MARKER"; then
                EXISTING="$CAND"
                break
              fi
            done
            if [ -n "$EXISTING" ]; then
              echo "Already synced: ${KIND} #${NUMBER} -> target #${EXISTING}"
              return
            fi

            local ITEM
            if [ "$KIND" == "pr" ]; then
              ITEM=$(gh api "repos/${SOURCE_REPO}/pulls/${NUMBER}")
            else
              ITEM=$(gh api "repos/${SOURCE_REPO}/issues/${NUMBER}")
            fi

            local TITLE BODY STATE AUTHOR URL CREATED
            TITLE=$(echo "$ITEM" | jq -r '.title')
            BODY=$(echo "$ITEM" | jq -r '.body // ""')
            STATE=$(echo "$ITEM" | jq -r '.state')
            AUTHOR=$(echo "$ITEM" | jq -r '.user.login')
            URL=$(echo "$ITEM" | jq -r '.html_url')
            CREATED=$(echo "$ITEM" | jq -r '.created_at')

            local HEADER
            if [ "$KIND" == "pr" ]; then
              HEADER="> **Pull Request** by @${AUTHOR} opened ${CREATED} — [view original](${URL})"
            else
              HEADER="> **Issue** by @${AUTHOR} opened ${CREATED} — [view original](${URL})"
            fi
            local FULL_BODY
            FULL_BODY=$(printf '%s\n\n%s\n\n---\n\n%s' "$HEADER" "$MARKER" "$BODY")

            local LABEL_ARGS=()
            [ "$KIND" == "pr" ] && LABEL_ARGS+=(--label "pull-request")

            local NEW_URL NEW_NUMBER
            NEW_URL=$(gh issue create --repo "$TARGET_REPO" --title "$TITLE" --body "$FULL_BODY" "${LABEL_ARGS[@]}")
            NEW_NUMBER=$(echo "$NEW_URL" | grep -oE '[0-9]+$')

            echo "$ITEM" | jq -r '.labels[]?.name' | while read -r LBL; do
              [ -n "$LBL" ] && gh issue edit "$NEW_NUMBER" --repo "$TARGET_REPO" --add-label "$LBL" 2>/dev/null || true
            done

            gh api "repos/${SOURCE_REPO}/issues/${NUMBER}/comments" --paginate | jq -c '.[]' | while read -r COMMENT; do
              local C_AUTHOR C_BODY C_URL
              C_AUTHOR=$(echo "$COMMENT" | jq -r '.user.login')
              C_BODY=$(echo "$COMMENT" | jq -r '.body')
              C_URL=$(echo "$COMMENT" | jq -r '.html_url')
              gh issue comment "$NEW_NUMBER" --repo "$TARGET_REPO" \
                --body "$(printf '> @%s commented — [view original](%s)\n\n%s' "$C_AUTHOR" "$C_URL" "$C_BODY")"
            done

            if [ "$STATE" == "closed" ]; then
              gh issue close "$NEW_NUMBER" --repo "$TARGET_REPO"
            fi

            echo "Synced ${KIND} #${NUMBER} -> target #${NEW_NUMBER}"
          }

          echo "Fetching issues..."
          gh api "repos/${SOURCE_REPO}/issues?state=all&per_page=100" --paginate \
            | jq -c '.[] | select(.pull_request == null)' \
            | jq -r '.number' \
            | while read -r NUM; do sync_item "$NUM" "issue"; done

          echo "Fetching pull requests..."
          gh api "repos/${SOURCE_REPO}/pulls?state=all&per_page=100" --paginate \
            | jq -r '.[].number' \
            | while read -r NUM; do sync_item "$NUM" "pr"; done
