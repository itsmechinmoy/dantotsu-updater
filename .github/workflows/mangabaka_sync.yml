name: Sync AniList to MangaBaka

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      force_full_sync:
        description: 'Force full sync of all entries (ignore change detection)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run sync script
        env:
          ANILIST_USERNAME: "itsmechinmoy"
          ANILIST_TOKEN: ${{ secrets.ANILIST_TOKEN }}
          MANGABAKA_API_KEY: ${{ secrets.MANGABAKA_API_KEY }}
          FORCE_FULL_SYNC: ${{ github.event.inputs.force_full_sync || 'false' }}
        run: python scripts/mangabaka-sync.py

      - name: Upload mapping & state artifacts (90 days retention)
        uses: actions/upload-artifact@v4
        with:
          name: anilist-mangabaka-data
          path: |
            mapping_cache.json
            sync_state.json
          retention-days: 90

      - name: Commit and push updated mappings and state
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add mapping_cache.json sync_state.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update AniList-MangaBaka state [skip ci]" && git push)
