name: Sync AniList to MangaBaka

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write # Needed to commit cache updates & upload artifacts

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run sync script
        env:
          ANILIST_USERNAME: "itsmechinmoy"
          ANILIST_TOKEN: ${{ secrets.ANILIST_TOKEN }}
          MANGABAKA_API_KEY: ${{ secrets.MANGABAKA_API_KEY }}
        run: python sync.py

      - name: Upload mapping artifact (90 days retention)
        uses: actions/upload-artifact@v4
        with:
          name: anilist-mangabaka-mappings
          path: mapping_cache.json
          retention-days: 90

      - name: Commit and push updated mappings
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add mapping_cache.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update AniList-MangaBaka mappings [skip ci]" && git push)
