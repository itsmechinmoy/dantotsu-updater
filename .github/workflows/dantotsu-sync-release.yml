name: Build, Release and Sync Dantotsu

permissions:
  contents: write

concurrency:
  group: build-release
  cancel-in-progress: true

on:
  schedule:
    - cron: "0 * * * *" # Run every hour
  workflow_dispatch:

jobs:
  check-updates:
    runs-on: ubuntu-latest
    outputs:
      SHOULD_RUN: ${{ steps.compare.outputs.SHOULD_RUN }}
      LATEST_SHA: ${{ steps.compare.outputs.LATEST_SHA }}
      LAST_SHA: ${{ steps.compare.outputs.LAST_SHA }}
      VERSION: ${{ steps.version.outputs.VERSION }}

    steps:
      - name: Install Expect
        run: sudo apt-get update && sudo apt-get install -y expect

      - name: Setup SSH Agent with Passphrase
        env:
          SSH_KEY: ${{ secrets.FORGEJO_SSH_KEY }}
          PASSPHRASE: ${{ secrets.FORGEJO_PASSPHRASE }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/forgejo_key
          chmod 600 ~/.ssh/forgejo_key
          
          eval $(ssh-agent -s)
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> $GITHUB_ENV
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> $GITHUB_ENV
          
          expect <<EOF
            spawn ssh-add /home/runner/.ssh/forgejo_key
            expect "Enter passphrase"
            send "$PASSPHRASE\r"
            expect eof
          EOF

      - name: Setup SSH Config
        run: |
          ssh-keyscan -p 2222 gitssh.rebelonion.dev >> ~/.ssh/known_hosts
          cat <<EOF > ~/.ssh/config
          Host gitssh.rebelonion.dev
            HostName gitssh.rebelonion.dev
            Port 2222
            User git
            IdentityFile ~/.ssh/forgejo_key
            IdentitiesOnly yes
          EOF

      - name: Checkout Repository
        run: |
          git clone --depth 1 --branch dev gitssh.rebelonion.dev:rebelonion/Dantotsu.git .

      - name: Download last SHA from latest release
        id: download-last-sha
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          HTTP_STATUS=$(curl -s -o release.json -w "%{http_code}" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/releases/latest")

          if [ "$HTTP_STATUS" = "200" ]; then
            SHA_URL=$(jq -r '.assets[]? | select(.name == "last_sha.txt") | .browser_download_url' release.json)
            if [ -n "$SHA_URL" ] && [ "$SHA_URL" != "null" ]; then
              curl -sfL "$SHA_URL" -o last_sha.txt
              echo "Downloaded last SHA from release"
            else
              echo "Latest release has no last_sha.txt asset, treating as first run"
            fi
          elif [ "$HTTP_STATUS" = "404" ]; then
            echo "No releases found yet, this is a genuine first run"
          else
            echo "::error::GitHub API returned HTTP $HTTP_STATUS while checking the latest release"
            cat release.json
            exit 1
          fi

      - name: Check for updates
        id: compare
        run: |
          LATEST_SHA=$(git rev-parse HEAD)
          echo "LATEST_SHA=${LATEST_SHA}" >> $GITHUB_OUTPUT
          if [ -f last_sha.txt ]; then
            LAST_SHA=$(cat last_sha.txt)
            echo "LAST_SHA=${LAST_SHA}" >> $GITHUB_OUTPUT
            echo "Last SHA: $LAST_SHA | Latest SHA: $LATEST_SHA"
          else
            LAST_SHA=""
            echo "LAST_SHA=" >> $GITHUB_OUTPUT
            echo "No previous SHA found. First run detected."
          fi
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] || [ "$LATEST_SHA" != "$LAST_SHA" ]; then
            echo "SHOULD_RUN=true" >> $GITHUB_OUTPUT
            echo "$LATEST_SHA" > last_sha.txt
          else
            echo "SHOULD_RUN=false" >> $GITHUB_OUTPUT
          fi

      - name: Extract Version
        if: steps.compare.outputs.SHOULD_RUN == 'true'
        id: version
        run: |
          VER=$(grep -E -o 'versionName = "[^"]*"' app/build.gradle.kts | cut -d'"' -f2)
          SHA=$(git rev-parse HEAD)
          VERSION="${VER}+${SHA:0:7}"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

  sync:
    runs-on: ubuntu-latest
    needs: check-updates
    if: needs.check-updates.outputs.SHOULD_RUN == 'true'

    steps:
      - name: Install Expect
        run: sudo apt-get update && sudo apt-get install -y expect

      - name: Setup SSH Agent with Passphrase
        env:
          SSH_KEY: ${{ secrets.FORGEJO_SSH_KEY }}
          PASSPHRASE: ${{ secrets.FORGEJO_PASSPHRASE }}
          OTHER_SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/forgejo_key
          echo "$OTHER_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/forgejo_key ~/.ssh/id_ed25519
          
          eval $(ssh-agent -s)
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> $GITHUB_ENV
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> $GITHUB_ENV
          
          expect <<EOF
            spawn ssh-add /home/runner/.ssh/forgejo_key
            expect "Enter passphrase"
            send "$PASSPHRASE\r"
            expect eof
          EOF
          
          # Add the sync key (assuming no passphrase for this one)
          ssh-add ~/.ssh/id_ed25519

      - name: Setup SSH Config
        run: |
          ssh-keyscan -p 2222 gitssh.rebelonion.dev >> ~/.ssh/known_hosts
          ssh-keyscan codeberg.org gitlab.com >> ~/.ssh/known_hosts
          cat <<EOF > ~/.ssh/config
          Host gitssh.rebelonion.dev
            HostName gitssh.rebelonion.dev
            Port 2222
            User git
            IdentityFile ~/.ssh/forgejo_key
            IdentitiesOnly yes
          EOF

      - name: Checkout Repository
        run: |
          git clone --branch dev gitssh.rebelonion.dev:rebelonion/Dantotsu.git .
          git fetch origin dev
          git checkout dev

      - name: Configure Git
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

      - name: Sync to GitHub (itsmechinmoy/Dantotsu main)
        env:
          GITHUB_PAT: ${{ secrets.DANTOTSU_SYNC }}
        run: |
          git remote add github https://$GITHUB_PAT@github.com/itsmechinmoy/Dantotsu.git
          git push github dev:main --force

      - name: Sync to Codeberg
        run: |
          git remote add codeberg git@codeberg.org:itsmechinmoy/Dantotsu.git
          git rm -f .github/workflows/codeberg-gitlab-sync.yml 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Remove sync workflow file"
          git push codeberg dev --force

      - name: Sync to GitLab
        run: |
          git remote add gitlab git@gitlab.com:itsmechinmoy/dantotsu.git
          git push gitlab dev --force

  build:
    runs-on: ubuntu-latest
    needs: [check-updates, sync]
    if: needs.check-updates.outputs.SHOULD_RUN == 'true'

    steps:
      - name: Install Expect
        run: sudo apt-get update && sudo apt-get install -y expect

      - name: Setup SSH Agent with Passphrase
        env:
          SSH_KEY: ${{ secrets.FORGEJO_SSH_KEY }}
          PASSPHRASE: ${{ secrets.FORGEJO_PASSPHRASE }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/forgejo_key
          chmod 600 ~/.ssh/forgejo_key
          
          eval $(ssh-agent -s)
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> $GITHUB_ENV
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> $GITHUB_ENV
          
          expect <<EOF
            spawn ssh-add /home/runner/.ssh/forgejo_key
            expect "Enter passphrase"
            send "$PASSPHRASE\r"
            expect eof
          EOF

      - name: Setup SSH Config
        run: |
          ssh-keyscan -p 2222 gitssh.rebelonion.dev >> ~/.ssh/known_hosts
          cat <<EOF > ~/.ssh/config
          Host gitssh.rebelonion.dev
            HostName gitssh.rebelonion.dev
            Port 2222
            User git
            IdentityFile ~/.ssh/forgejo_key
            IdentitiesOnly yes
          EOF

      - name: Checkout Repository
        run: |
          git clone --branch dev gitssh.rebelonion.dev:rebelonion/Dantotsu.git .

      - name: Fetch full history for commit log
        run: |
          if [ -n "${{ needs.check-updates.outputs.LAST_SHA }}" ]; then
            git fetch --unshallow || true
            git fetch --depth=100 origin dev || true
          fi

      - name: Generate Commit Log
        id: commit-log
        run: |
          REPO_URL="https://git.rebelonion.dev/rebelonion/Dantotsu"
          if [ -n "${{ needs.check-updates.outputs.LAST_SHA }}" ]; then
            LAST_SHA="${{ needs.check-updates.outputs.LAST_SHA }}"
            if git cat-file -e "$LAST_SHA^{commit}" 2>/dev/null; then
              COMMIT_LOGS=$(git log $LAST_SHA..HEAD --pretty=format:"● %s ~%an [֍](${REPO_URL}/commit/%H)" --max-count=10)
            else
              echo "Warning: Last SHA not found in history, showing last 10 commits"
              COMMIT_LOGS=$(git log HEAD --pretty=format:"● %s ~%an [֍](${REPO_URL}/commit/%H)" --max-count=10)
            fi
          else
            LAST_SHA=$(git rev-list --max-parents=0 HEAD)
            COMMIT_LOGS=$(git log $LAST_SHA..HEAD --pretty=format:"● %s ~%an [֍](${REPO_URL}/commit/%H)" --max-count=10)
          fi
          if [ -z "$COMMIT_LOGS" ]; then
            COMMIT_LOGS="● No new commits since last release"
          fi
          COMMIT_LOGS=$(echo "$COMMIT_LOGS" | sed -E "s@#([0-9]+)@[#\1](${REPO_URL}/pull/\1)@g")
          # Save for Telegram
          echo "COMMIT_LOG<<EOF" >> $GITHUB_OUTPUT
          echo "$COMMIT_LOGS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          # Save base commit log
          echo -e "Commits:\n" > commit_log.txt
          echo "$COMMIT_LOGS" | sed 's/●/\n●/g' | sed '/^$/d' >> commit_log.txt

      - name: Setup JDK 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: "temurin"
          java-version: 17
          cache: gradle

      - name: Add Split APK Configuration
        run: |
          if ! grep -q "splits {" app/build.gradle.kts; then
            sed -i '/^android {/a\
                splits {\
                    abi {\
                        isEnable = true\
                        reset()\
                        include("armeabi-v7a", "arm64-v8a", "x86", "x86_64")\
                        isUniversalApk = true\
                    }\
                }' app/build.gradle.kts
          fi

      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE_FILE }}" | base64 -d > $GITHUB_WORKSPACE/key.keystore

      - name: Build APKs
        run: |
          chmod +x ./gradlew
          ./gradlew assembleGoogleRelease \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/key.keystore \
            -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

      - name: Process APKs and Generate Checksums
        run: |
          cd app/build/outputs/apk/google/release/
          if [ -f "app-google-universal-release.apk" ]; then
            UNIVERSAL="app-google-universal-release.apk"
          elif [ -f "app-google-release.apk" ]; then
            UNIVERSAL="app-google-release.apk"
          fi
          
          {
            echo -e "\n---\n### Checksums\n"
            echo "| Variant | SHA-256 |"
            echo "| ------- | ------- |"
            if [ -n "$UNIVERSAL" ]; then
              SHA=$(sha256sum "$UNIVERSAL" | cut -d' ' -f1)
              echo "| Universal | $SHA |"
            fi
            for apk in app-google-*-release.apk; do
              [ "$apk" = "$UNIVERSAL" ] && continue
              [ "$apk" = "app-google-*-release.apk" ] && continue
              ABI=$(echo "$apk" | sed 's/app-google-//' | sed 's/-release.apk//')
              SHA=$(sha256sum "$apk" | cut -d' ' -f1)
              echo "| $ABI | $SHA |"
            done
            echo -e "\n---\n"
          } > $GITHUB_WORKSPACE/checksums.txt
          
          cd $GITHUB_WORKSPACE
          {
            cat commit_log.txt
            cat checksums.txt
            CURRENT_TAG_SAFE=$(echo "v${{ needs.check-updates.outputs.VERSION }}" | sed 's/+/%2B/g')
            echo "![Total Downloads](https://img.shields.io/github/downloads/itsmechinmoy/dantotsu-updater/total?style=for-the-badge&label=TOTAL%20DOWNLOADS&labelColor=black&color=white) ![Current Release](https://img.shields.io/github/downloads/itsmechinmoy/dantotsu-updater/${CURRENT_TAG_SAFE}/total?style=for-the-badge&label=CURRENT%20RELEASE&labelColor=black&color=white)"
          } > commit_log_updater.txt
  
          {
            cat commit_log.txt
            cat checksums.txt
            CURRENT_TAG_SAFE=$(echo "v${{ needs.check-updates.outputs.VERSION }}" | sed 's/+/%2B/g')
            echo "![Total Downloads](https://img.shields.io/github/downloads/itsmechinmoy/Dantotsu/total?style=for-the-badge&label=TOTAL%20DOWNLOADS&labelColor=black&color=white) ![Current Release](https://img.shields.io/github/downloads/itsmechinmoy/Dantotsu/${CURRENT_TAG_SAFE}/total?style=for-the-badge&label=CURRENT%20RELEASE&labelColor=black&color=white)"
          } > commit_log_dantotsu.txt

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Dantotsu-APKs
          retention-days: 5
          compression-level: 9
          path: app/build/outputs/apk/google/release/*.apk

      - name: Upload to Telegram
        env:
          VERSION: ${{ needs.check-updates.outputs.VERSION }}
          COMMIT_LOG: ${{ steps.commit-log.outputs.COMMIT_LOG }}
        run: |
          cd app/build/outputs/apk/google/release/
          if [ -f "app-google-arm64-v8a-release.apk" ]; then
            APK_PATH="app-google-arm64-v8a-release.apk"
          elif [ -f "app-google-release.apk" ]; then
            APK_PATH="app-google-release.apk"
          else
            echo "No arm64-v8a APK found!"
            exit 1
          fi
          
          telegram_commit_messages=$(echo "$COMMIT_LOG" | while read -r line; do
            message=$(echo "$line" | sed -E 's/● (.*) ~(.*) \[֍\]\((.*)\)/● \1 ~\2 <a href="\3">֍<\/a>/')
            message=$(echo "$message" | sed -E 's/\[#([0-9]+)\]\((https:\/\/[^)]+)\)/<a href="\2">#\1<\/a>/g')
            echo "$message"
          done)
          telegram_commit_messages="<blockquote>${telegram_commit_messages}</blockquote>"
          
          curl -sS -f -X POST \
            "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument" \
            -F "chat_id=-1003463471716" \
            -F "document=@$APK_PATH" \
            -F "caption=🔥 New Dantotsu Build Available!
          Commits:
          ${telegram_commit_messages}
          Version: ${VERSION}" \
            -F "parse_mode=HTML"

      - name: Save SHA for next run
        run: |
          echo "${{ needs.check-updates.outputs.LATEST_SHA }}" > last_sha.txt

      - name: Create Release in dantotsu-updater
        uses: ncipollo/release-action@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          tag: v${{ needs.check-updates.outputs.VERSION }}
          name: Dantotsu v${{ needs.check-updates.outputs.VERSION }}
          bodyFile: commit_log_updater.txt
          artifacts: |
            app/build/outputs/apk/google/release/*.apk
            last_sha.txt
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
          makeLatest: true

      - name: Create Release in Dantotsu
        uses: ncipollo/release-action@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          tag: v${{ needs.check-updates.outputs.VERSION }}
          name: Dantotsu v${{ needs.check-updates.outputs.VERSION }}
          bodyFile: commit_log_dantotsu.txt
          artifacts: app/build/outputs/apk/google/release/*.apk
          token: ${{ secrets.DANTOTSU_SYNC }}
          repo: Dantotsu
          owner: itsmechinmoy
          allowUpdates: true
          makeLatest: true

      - name: Upload Commit Log Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: commit-log
          path: |
            commit_log_updater.txt
            commit_log_dantotsu.txt
          retention-days: 30
